[project]
name = "autocad-mcp"
version = "0.1.0"
description = "MCP server for controlling AutoCAD via COM, with solar panel layout tools"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
